name: Release

# Every merge to main publishes a CANDIDATE on the npm `next` dist-tag.
# `latest` (bare `npm i @trawlme/n8n-nodes-trawl`, what n8n installs) does NOT move on
# merge: promote it with promote.yml after QA. Same model as trawl_skills and
# trawl_cli.
#
# semantic-release computes the version from the commits (.releaserc.json, same
# releaseRules as trawl_skills) and tags vX.Y.Z. The package is built, linted and
# tested BEFORE semantic-release so a red tree never gets a tag. The publish is
# npm Trusted Publishing (OIDC, no npm token) with a provenance attestation,
# which n8n requires for community-node verification.
#
# One-time setup (human, BEFORE merging the first change after this file):
# - GitHub environment `prod`: deployment branches limited to `main`, no
#   required reviewers (the human gate is promote.yml), holding the
#   TRAWL_RELEASE secret (PAT that pushes the tag).
# - npm only accepts a trusted publisher on an existing package. Bootstrap it
#   once from main, the only hand publish ever: `RELEASE_MODE=true npm publish
#   --tag next` (package.json's 0.1.0, no provenance), then tag that commit
#   `v0.1.0` and push the tag so semantic-release continues from 0.1.0. Never
#   hand-publish a version CI will produce: npm versions cannot be reused.
# - Then register the trusted publisher (workflow `release.yml`, environment
#   `prod`) and allow direct publishing (a new trusted publisher defaults to
#   staged publishing, which makes this job fail).
on:
  push:
    branches: [main]
    paths-ignore:
      - '.claude/**'
  workflow_dispatch:

# Two pushes in quick succession must never race semantic-release on the
# same npm version/tag.
concurrency:
  group: release
  cancel-in-progress: false

# Tags and the GitHub release go through the TRAWL_RELEASE token, not this one.
permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # A dispatch from another branch must never publish that branch's code.
    if: github.ref == 'refs/heads/main'
    environment: prod
    timeout-minutes: 15

    steps:
      - name: Preflight — release secret present
        env:
          TRAWL_RELEASE: ${{ secrets.TRAWL_RELEASE }}
        run: |
          if [ -z "$TRAWL_RELEASE" ]; then
            echo "::error::TRAWL_RELEASE is not set on the prod environment (see the one-time setup in this file's header)."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.TRAWL_RELEASE }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.TRAWL_RELEASE }}

      # Re-run trap: if semantic-release tagged a version on a prior run but the
      # npm publish failed, a re-run sees nothing new to release. Fall back to
      # a tag that points at HEAD, so the publish still gets its chance. Only
      # HEAD's own tag: an older tag would publish newer code under its number.
      - name: Resolve release version to verify against npm
        id: version
        env:
          PUBLISHED: ${{ steps.semantic.outputs.new_release_published }}
          NEW_VERSION: ${{ steps.semantic.outputs.new_release_version }}
        run: |
          if [ "$PUBLISHED" = "true" ]; then
            version="$NEW_VERSION"
          else
            version="$(git describe --tags --exact-match --match 'v*' HEAD 2>/dev/null | sed 's/^v//')"
          fi
          if [ -n "$version" ] && ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Release version '$version' is not X.Y.Z; refusing to publish."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check whether that version is already on npm
        id: npm_check
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # Only a genuine E404 means "never published"; any other npm error fails
        # the step instead of guessing.
        run: |
          set +e
          output="$(npm view "@trawlme/n8n-nodes-trawl@$VERSION" version 2>&1)"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif echo "$output" | grep -q 'E404'; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::npm view failed for a reason other than 'not found' (E404); refusing to guess."
            echo "$output"
            exit 1
          fi

      - name: Publish to npm via OIDC (next channel)
        if: steps.version.outputs.version != '' && steps.npm_check.outputs.published != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          # package.json's prepublishOnly (n8n-node prerelease) blocks a bare
          # `npm publish` unless RELEASE_MODE is set; lint/build/test already
          # ran above.
          RELEASE_MODE: 'true'
        run: |
          # npm Trusted Publishing (token-less OIDC) requires npm >= 11.5.1;
          # Node 22 ships npm 10.x, which fails with ENEEDAUTH on publish.
          npm install -g npm@latest
          npm version "$VERSION" --no-git-tag-version
          npm publish --provenance --access public --tag next
